<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Los archivos de los discos del servidor: navegar, subir, descargar, mover y copiar.">
  <meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171516" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Arca">
  <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png?v=4">
  <link rel="icon" href="/iconos/icono.svg?v=4" type="image/svg+xml">
  <title>Arca</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/tema.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="marca" href="#" aria-label="Arca, ir al inicio">
        <!-- Logo: la silueta de un cofre con su cierre y la A de Arca -->
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <path d="M4.5 14.5v-1C4.5 7.6 11.4 4 20 4s15.5 3.6 15.5 9.5v21.5a2 2 0 0 1-2 2h-27a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M4.5 14.5h13M22.5 14.5h13" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <rect x="17.5" y="11.5" width="5" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M14.2 32 20 21l5.8 11M16.3 28h7.4" fill="none" stroke="var(--acento)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="marca-nombre">Arca</span>
      </a>
      <span class="miga" id="miga" hidden></span>
      <div class="acciones-top" id="acciones-top" hidden>
        <input type="search" id="buscar" class="buscar-top" placeholder="Buscar…" title="Busca en esta carpeta y en las de dentro" aria-label="Buscar" autocomplete="off" enterkeyhint="search">
        <button class="btn-icono btn-tema" id="btn-tema" type="button"></button>
        <button class="btn-icono btn-tema" id="btn-menu" type="button" aria-label="Menú" title="Menú"></button>
      </div>
    </div>
  </header>

  <main class="contenido" id="contenido"></main>

  <div class="menu" id="menu" hidden></div>
  <div class="tareas" id="tareas" hidden></div>
  <div class="avisos" id="avisos" aria-live="polite"></div>
  <noscript><p class="contenido">Arca necesita JavaScript.</p></noscript>
</body>
</html>
